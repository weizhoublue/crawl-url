name: Release CI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Tests
        run: go test -v ./...

      - name: Build Binaries
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 go build -o bin/crawl-url-linux-amd64 ./cmd/crawl-url
          GOOS=linux GOARCH=arm64 go build -o bin/crawl-url-linux-arm64 ./cmd/crawl-url
          GOOS=darwin GOARCH=arm64 go build -o bin/crawl-url-darwin-arm64 ./cmd/crawl-url

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/crawl-url-linux-amd64
            bin/crawl-url-linux-arm64
            bin/crawl-url-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and Push Release Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release/${{ github.ref_name }}
          git push origin release/${{ github.ref_name }}
