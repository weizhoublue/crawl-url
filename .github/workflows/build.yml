name: Build CI (Manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git branch, tag, or commit hash to build'
        required: true
        default: 'main'

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Unit Tests
        run: go test -v ./internal/... ./cmd/...

      - name: Run End-to-End Tests
        run: go test -v -count=1 ./tests/...

      - name: Build Binaries
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 go build -o bin/crawl-url-linux-amd64 ./cmd/crawl-url
          GOOS=linux GOARCH=arm64 go build -o bin/crawl-url-linux-arm64 ./cmd/crawl-url
          GOOS=darwin GOARCH=arm64 go build -o bin/crawl-url-darwin-arm64 ./cmd/crawl-url

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crawl-url-binaries
          path: bin/*
          retention-days: 7
