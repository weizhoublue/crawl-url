name: PR CI

on:
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Unit Tests
        run: go test -v ./internal/... ./cmd/...

      - name: Run End-to-End Tests
        run: go test -v -count=1 ./tests/...

      - name: Test Build
        run: go build -v ./cmd/crawl-url
